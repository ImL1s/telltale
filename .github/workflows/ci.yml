# Verification CI for Telltale.
#
# This repo is the app on its own — the same source that ships on Google Play,
# with nothing held back. So the checks here are the ones that decide whether a
# build is honest, not a subset kept for show.
#
# Free public runners here are the authoritative remote matrix for
# multiplatform enablement (Android + Apple iOS/macOS + Linux + Windows).
# Compile gates alone are not enough: Apple/Linux/Windows jobs also run a
# Demo/export/transport functional smoke suite after building. The private
# source repo may be Actions-billing-blocked; do not treat private Actions
# green as a merge requirement when this workflow already exercises every
# target platform.
#
# One check is unusual and is the point of the whole file: the `oracle` job runs
# the test suite against an ELM327 simulator that nobody on this project wrote.
# Every other test in this repository is our parser against our simulator, and
# both sides carry the same reading of J1979 — so a misreading agrees with
# itself and goes green. The oracle is the only place that cannot happen.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pubspec.yaml requires `sdk: ^3.13.0` and `flutter: ">=3.47.0"`. This pin is
  # mandatory, not stylistic.
  FLUTTER_VERSION: "3.47.0"

jobs:
  app:
    name: analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # AGP 9.1.0 (android/settings.gradle.kts) needs JDK 17+.
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze

      # The three simulator-backed oracle files self-skip here because no
      # simulator is listening. The `oracle` job below exercises the public
      # third-party suite and refuses to pass if any expected test skips; the
      # source repository's CI also runs the additional oracle suites.
      # No count is asserted here on purpose: pinning one turns every added test
      # into a CI failure, which trains people to edit the number rather than
      # read it.
      - run: flutter test

      # Debug signing needs no secrets. Build both identities so the physical
      # adapter app can never accidentally inherit the rig package or label.
      - name: Build and verify Android field/rig identities
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor field
          flutter build apk --debug --flavor rig \
            --dart-define=TELLTALE_TEST_RIG=true

          field_apk=build/app/outputs/flutter-apk/app-field-debug.apk
          rig_apk=build/app/outputs/flutter-apk/app-rig-debug.apk
          test -f "$field_apk"
          test -f "$rig_apk"
          aapt=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
            -type f -name aapt -perm -111 | sort -V | tail -n 1)
          test -n "$aapt"
          field_badging=$($aapt dump badging "$field_apk")
          rig_badging=$($aapt dump badging "$rig_apk")
          grep -Fq "package: name='com.cbstudio.telltale'" <<< "$field_badging"
          grep -Fq "application-label:'Telltale'" <<< "$field_badging"
          grep -Fq "package: name='com.cbstudio.telltale.rig'" <<< "$rig_badging"
          grep -Fq "application-label:'Telltale Rig'" <<< "$rig_badging"
          if grep -Eiq "com\.cbstudio\.telltale\.rig|Telltale Rig|versionName='[^']*-rig" \
              <<< "$field_badging"; then
            echo "::error::Field APK contains the rig identity"
            exit 1
          fi

  vehicle-catalogs:
    name: vehicle catalogs — offline updater tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
          architecture: x64

      # These checks are deliberately offline. Live official-source freshness
      # checks are a maintainer operation, not a deterministic pull-request gate.
      - name: Compile and test vehicle catalog updaters
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tool/update_us_vehicle_catalog.py \
            tool/update_us_vpic_makes.py
          python3 -m unittest discover \
            -s test/tool -p 'test_*.py' -v

  apple:
    name: Apple build + functional smoke
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Compiling is not running. These builds still catch plugins that drop
      # Apple support; the smoke suite below exercises Demo → dashboard and
      # export on the same runner that produced the binaries.
      - name: Build iOS without code signing
        run: flutter build ios --no-codesign

      - name: Build macOS debug
        run: flutter build macos --debug

      - name: Functional smoke (Demo journey, export, transport gates)
        run: |
          set -euo pipefail
          flutter test \
            test/demo_connect_journey_test.dart \
            test/transcript_export_smoke_test.dart \
            test/telemetry_demo_journey_test.dart \
            test/desktop_telemetry_share_smoke_test.dart \
            test/which_transport_test.dart \
            test/wifi_transport_test.dart \
            test/telemetry_heartbeat_test.dart \
            test/app_wakelock_test.dart \
            test/remembered_adapter_navigation_test.dart

      # Unsigned desktop archive from the debug tree already built above.
      # Release DMG + notarization need Apple secrets — see tool/packaging/.
      # default-flavor: field → Debug-field (unflavored Debug kept as fallback).
      - name: Package unsigned macOS .app zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(
            build/macos/Build/Products/Debug-field/*.app
            build/macos/Build/Products/Debug/*.app
          )
          test ${#apps[@]} -gt 0
          mkdir -p build/packaging
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" \
            build/packaging/Telltale-macos-debug-unsigned.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telltale-macos-debug-unsigned
          path: build/packaging/Telltale-macos-debug-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux build + functional smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # libbluetooth-dev: flutter_classic_bluetooth's Linux CMake hard-requires
          # BlueZ headers even though Classic SPP remains Android-only in the UI.
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libbluetooth-dev

      - run: flutter pub get

      - name: Build Linux debug
        run: flutter build linux --debug

      # Widget/unit smoke on the Linux runner after a successful desktop binary.
      # This is not a GTK `flutter run` of the binary, but it is the Demo
      # connect path and export contract the binary embeds.
      - name: Functional smoke (Demo journey, export, transport gates)
        run: |
          set -euo pipefail
          flutter test \
            test/demo_connect_journey_test.dart \
            test/transcript_export_smoke_test.dart \
            test/telemetry_demo_journey_test.dart \
            test/desktop_telemetry_share_smoke_test.dart \
            test/which_transport_test.dart \
            test/wifi_transport_test.dart \
            test/telemetry_heartbeat_test.dart \
            test/app_wakelock_test.dart \
            test/remembered_adapter_navigation_test.dart

      - name: Package unsigned Linux debug tarball
        run: |
          set -euo pipefail
          # default-flavor: field → …/field/debug/bundle
          bundle=""
          for candidate in \
            build/linux/x64/field/debug/bundle \
            build/linux/arm64/field/debug/bundle \
            build/linux/x64/debug/bundle \
            build/linux/arm64/debug/bundle
          do
            if [[ -d "$candidate" ]]; then bundle="$candidate"; break; fi
          done
          test -n "$bundle"
          mkdir -p build/packaging
          tar -C "$(dirname "$bundle")" -czf \
            build/packaging/Telltale-linux-debug-unsigned.tar.gz \
            "$(basename "$bundle")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telltale-linux-debug-unsigned
          path: build/packaging/Telltale-linux-debug-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build + functional smoke
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows debug
        run: flutter build windows --debug

      - name: Functional smoke (Demo journey, export, transport gates)
        run: |
          set -euo pipefail
          flutter test \
            test/demo_connect_journey_test.dart \
            test/transcript_export_smoke_test.dart \
            test/telemetry_demo_journey_test.dart \
            test/desktop_telemetry_share_smoke_test.dart \
            test/which_transport_test.dart \
            test/wifi_transport_test.dart \
            test/telemetry_heartbeat_test.dart \
            test/app_wakelock_test.dart \
            test/remembered_adapter_navigation_test.dart

      - name: Package unsigned Windows debug zip
        shell: pwsh
        run: |
          # default-flavor: field → …/field/runner/Debug
          $runner = @(
            'build/windows/x64/field/runner/Debug',
            'build/windows/arm64/field/runner/Debug',
            'build/windows/x64/runner/Debug',
            'build/windows/arm64/runner/Debug'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $runner) { throw 'missing Windows Debug runner' }
          New-Item -ItemType Directory -Force -Path build/packaging | Out-Null
          Compress-Archive -Path $runner `
            -DestinationPath build/packaging/Telltale-windows-debug-unsigned.zip `
            -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telltale-windows-debug-unsigned
          path: build/packaging/Telltale-windows-debug-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  privacy:
    name: the two privacy policies agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # There are two copies of the privacy policy and that is the defect.
      # PRIVACY.md is what a reader of this repo sees; docs/privacy.html is the
      # URL registered with Google Play, so it is the authoritative one. They
      # have already drifted once — different "last updated" dates, and the
      # Markdown's English half was missing the children's-data and payment
      # clauses that the served page has. A reader in English was looking at a
      # policy with holes in it.
      #
      # Merging them would mean picking one audience to serve worse. Failing
      # loudly when they disagree costs nothing and catches the same drift.
      - name: Compare sections and dates
        run: |
          python3 - <<'PY'
          import re, sys

          md = open('PRIVACY.md', encoding='utf-8').read()
          html = open('docs/privacy.html', encoding='utf-8').read()

          problems = []

          # 1. Dates. Four of them, and they must all say the same day.
          zh_md = re.search(r'最後更新：(.+)', md)
          en_md = re.search(r'Last updated: (.+)', md)
          zh_html = re.search(r'最後更新：([^<]+)', html)
          en_html = re.search(r'Last updated: ([^<]+)', html)
          if not all([zh_md, en_md, zh_html, en_html]):
              problems.append('a "last updated" line is missing from one of the files')
          else:
              def norm(m):
                  t = m.group(1).strip()
                  # 2026 年 8 月 18 日  ->  2026-8-18 ; 18 August 2026 -> same
                  cjk = re.match(r'(\d{4}) 年 (\d{1,2}) 月 (\d{1,2}) 日', t)
                  if cjk:
                      return tuple(int(g) for g in cjk.groups())
                  months = ['january','february','march','april','may','june','july',
                            'august','september','october','november','december']
                  eng = re.match(r'(\d{1,2}) (\w+) (\d{4})', t)
                  if eng:
                      d, mth, y = eng.groups()
                      return (int(y), months.index(mth.lower()) + 1, int(d))
                  return t
              dates = {norm(zh_md), norm(en_md), norm(zh_html), norm(en_html)}
              if len(dates) != 1:
                  problems.append(f'the four "last updated" dates disagree: {sorted(dates)}')

          # 2. Section lists, per language half. The one-sentence summary is a
          #    lede paragraph in HTML and a heading in Markdown; that is a
          #    formatting choice in each format, not a missing section.
          LEDE = {'一句話版本', 'In one sentence'}

          def halves(text, split_on, find):
              zh, en = text.split(split_on, 1)
              return [s for s in find(zh) if s not in LEDE], \
                     [s for s in find(en) if s not in LEDE]

          md_zh, md_en = halves(md, '# Telltale Privacy Policy',
                                lambda t: re.findall(r'^## (.+)$', t, re.M))
          html_zh, html_en = halves(html, '<h1>Telltale Privacy Policy</h1>',
                                    lambda t: re.findall(r'<h2>(.+?)</h2>', t))

          if md_zh != html_zh:
              problems.append(f'Chinese sections differ:\n  PRIVACY.md   {md_zh}\n  privacy.html {html_zh}')
          if md_en != html_en:
              problems.append(f'English sections differ:\n  PRIVACY.md   {md_en}\n  privacy.html {html_en}')
          if len(md_zh) != len(md_en):
              problems.append(f'PRIVACY.md halves are not the same policy:\n  zh {md_zh}\n  en {md_en}')
          if len(html_zh) != len(html_en):
              problems.append(f'privacy.html halves are not the same policy:\n  zh {html_zh}\n  en {html_en}')

          if problems:
              print('The two privacy policies have drifted. docs/privacy.html is the')
              print('authoritative one — it is the URL Google Play holds.\n')
              for p in problems:
                  print(' - ' + p)
              sys.exit(1)
          print(f'OK: {len(md_zh)} sections, identical across both files and both languages.')
          PY

  rigs:
    name: test rigs — framing and fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
          architecture: x64

      - name: Syntax checks
        run: |
          python3 -m py_compile \
            tool/ble_test_rig/emulator_entrypoint.py \
            tool/ble_test_rig/bridge.py \
            tool/ble_test_rig/process_identity.py \
            tool/ble_test_rig/probe.py \
            tool/ble_test_rig/test_bridge.py \
            tool/ble_test_rig/test_emulator_entrypoint.py \
            tool/ble_test_rig/test_probe.py \
            tool/ble_test_rig/test_process_identity.py \
            tool/ble_test_rig/test_run_controller.py \
            tool/obd_test_rig/chaos_proxy.py \
            tool/obd_test_rig/test_chaos_proxy.py

      - name: Unit tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest discover \
            -s tool/ble_test_rig -p 'test_*.py' -v
          python3 -m unittest discover \
            -s tool/obd_test_rig -p 'test_*.py' -v

  oracle:
    name: third-party ELM327 simulator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The lockfile's hashes name cp314 wheels, so the interpreter is part
          # of the pin — a runner's default python3 is not 3.14.
          python-version: "3.14.4"
          architecture: x64

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Without this guard the job is decoration. A skipped test prints a
      # summary indistinguishable from a passing one and `flutter test` exits 0
      # either way — so an oracle that never reached the simulator would report
      # exactly the same green as one that passed.
      - name: Install the skip guard
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/assert_no_skips.py" <<'PY'
          import json, sys

          report, expected = sys.argv[1], int(sys.argv[2])
          passed = skipped = failed = 0
          failures = []
          errors_by_id = {}
          with open(report, encoding="utf-8", errors="replace") as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  etype = event.get("type")
                  if etype == "error":
                      tid = event.get("testID")
                      if tid is not None:
                          errors_by_id.setdefault(tid, []).append(
                              event.get("error", event)
                          )
                      continue
                  if etype != "testDone" or event.get("hidden"):
                      continue
                  name = event.get("test", {}).get("name") or event.get("testID")
                  if event.get("skipped"):
                      skipped += 1
                  elif event.get("result") == "success":
                      passed += 1
                  else:
                      failed += 1
                      failures.append((name, errors_by_id.get(event.get("testID"), [])))

          print(f"oracle results: passed={passed} skipped={skipped} failed={failed}")
          for name, errs in failures:
              print(f"FAILED: {name}")
              for err in errs[:3]:
                  print(f"  {err}")
          if failed:
              sys.exit("FAIL: an oracle test failed.")
          if skipped:
              sys.exit(f"FAIL: {skipped} oracle test(s) skipped -- the simulator was "
                       "not reachable or not recognised. A skipped oracle is not a "
                       "passing oracle.")
          if passed != expected:
              sys.exit(f"FAIL: expected {expected} oracle tests, {passed} ran.")
          print("OK: every oracle test really ran.")
          PY

      - name: Ircama ELM327-emulator
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/elmvenv"
          # ELM327-emulator's build backend still imports pkg_resources, which
          # setuptools 82 removed (measured 2026-08-20: 81.0.0 still has it), so
          # a plain `pip install ELM327-emulator` exits 1 with
          # `ModuleNotFoundError: No module named 'pkg_resources'`.
          #
          # Both installs are hash-pinned. This job fetches and runs code from
          # PyPI on every push, and the whole point of the oracle is that it is
          # a fixed second opinion — a range would let a yanked-and-replaced
          # release quietly change what the app is being checked against.
          "$RUNNER_TEMP/elmvenv/bin/pip" install --quiet --require-hashes \
            --requirement "$GITHUB_WORKSPACE/.github/requirements/elm327-build.lock"
          # Upstream rewrites its own version string when GITHUB_RUN_NUMBER is
          # set, so inside Actions the reviewed sdist stops calling itself 3.0.5.
          env -u GITHUB_RUN_NUMBER "$RUNNER_TEMP/elmvenv/bin/pip" install --quiet \
            --no-build-isolation --require-hashes \
            --requirement "$GITHUB_WORKSPACE/.github/requirements/elm327-py314-linux-x86_64.lock"
          test "$("$RUNNER_TEMP/elmvenv/bin/python" -c \
            'import importlib.metadata as m; print(m.version("ELM327-emulator"))')" = "3.0.5"
          "$RUNNER_TEMP/elmvenv/bin/pip" check

          # -b is required: without a batch file this CLI exits the moment its
          # stdin sees EOF, which is exactly what a background CI step gives it.
          "$RUNNER_TEMP/elmvenv/bin/python" -m elm -n 35000 -s car \
            -b "$RUNNER_TEMP/elm_batch.log" > "$RUNNER_TEMP/elm.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/elm.pid"

          # Wait for LISTEN only. Deliberately NOT a TCP connect probe: this
          # emulator serves one client at a time, so a throwaway probe makes the
          # test's own AT@1 handshake fail, which silently skips every test
          # instead of failing.
          for _ in $(seq 1 30); do
            ss -ltn | grep -q ':35000' && break
            sleep 1
          done

          flutter test test/emulator_integration_test.dart --reporter json \
            > "$RUNNER_TEMP/ircama.json" || true
          python3 "$RUNNER_TEMP/assert_no_skips.py" "$RUNNER_TEMP/ircama.json" 6

      - name: Stop the emulator
        if: always()
        run: |
          # Kill by recorded PID. Never `pkill -f <pattern>` — the pattern would
          # match this very command line.
          [ -f "$RUNNER_TEMP/elm.pid" ] && kill "$(cat "$RUNNER_TEMP/elm.pid")" 2>/dev/null || true

      - name: Emulator log on failure
        if: failure()
        run: tail -80 "$RUNNER_TEMP/elm.log" 2>/dev/null || true
