include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  # Verified on 3.47.0: importing package:flutter/material.dart raises no
  # deprecation, so the material_ui migration stays opt-in and no error
  # override is needed here. See docs/protocol-deviations.zh-TW.md.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_print
    - unawaited_futures
    - require_trailing_commas
    - sort_child_properties_last
    - use_super_parameters
